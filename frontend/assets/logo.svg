<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing background circle -->
  <circle cx="250" cy="250" r="210" fill="url(#primaryGradient)" opacity="0.15" filter="url(#glow)" />
  
  <!-- Open Book Base -->
  <path d="M120 340 C180 320 220 340 250 355 C280 340 320 320 380 340 L380 230 C320 210 280 230 250 245 C220 230 180 210 120 230 Z" 
        fill="none" stroke="url(#primaryGradient)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Center spine line -->
  <line x1="250" y1="245" x2="250" y2="355" stroke="url(#primaryGradient)" stroke-width="14" stroke-linecap="round" />

  <!-- Floating Graduation Cap Top -->
  <polygon points="250,110 370,165 250,220 130,165" fill="url(#primaryGradient)" />
  <polygon points="250,110 370,165 250,220 130,165" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.4" />

  <!-- Cap Skull Base -->
  <path d="M180 190 L180 225 C180 245 250 260 250 260 C250 260 320 245 320 225 L320 190" 
        fill="url(#primaryGradient)" opacity="0.9" />

  <!-- Tassel -->
  <path d="M340 180 L360 230 C360 245 355 260 355 260" fill="none" stroke="url(#accentGradient)" stroke-width="8" stroke-linecap="round" />
  <circle cx="355" cy="265" r="8" fill="url(#accentGradient)" />

  <!-- AI Sparks / Nodes -->
  <circle cx="250" cy="110" r="10" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="130" cy="165" r="7" fill="#3b82f6" filter="url(#glow)"/>
  <circle cx="370" cy="165" r="7" fill="#8b5cf6" filter="url(#glow)"/>
  
  <!-- Spark Lines -->
  <line x1="250" y1="110" x2="210" y2="70" stroke="#06b6d4" stroke-width="4" stroke-dasharray="4,4" />
  <circle cx="205" cy="65" r="5" fill="#06b6d4" />

  <line x1="250" y1="110" x2="290" y2="70" stroke="#8b5cf6" stroke-width="4" stroke-dasharray="4,4" />
  <circle cx="295" cy="65" r="5" fill="#8b5cf6" />
</svg>
